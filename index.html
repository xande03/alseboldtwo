  <style>
    .splashscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    
    .splashscreen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    .splash-content {
      text-align: center;
      color: white;
      font-family: 'Space Grotesk', sans-serif;
    }
    
    .splash-title {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 1rem;
      animation: fadeInScale 1s ease-out;
    }
    
    .splash-subtitle {
      font-size: 1.5rem;
      opacity: 0.9;
      animation: fadeInScale 1s ease-out 0.3s;
      animation-fill-mode: both;
    }
    
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

  <body>
    <div id="splashscreen" class="splashscreen">
      <div class="splash-content">
        <h1 class="splash-title">Olá bravos</h1>
        <p class="splash-subtitle">Bem-vindo ao Alse Bold</p>
      </div>
    </div>
